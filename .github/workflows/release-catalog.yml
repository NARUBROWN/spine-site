name: 버전 현황 갱신
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-catalog.yml'
      - 'scripts/sync-release-catalog.py'
      - 'scripts/test_sync_release_catalog.py'
      - 'docs/.vitepress/theme/releases/catalog.json'
permissions:
  contents: read
concurrency:
  group: release-catalog
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/sync-release-catalog.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_sync_release_catalog.py'
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 공개 버전 수집과 검사
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync-release-catalog.py
          python3 scripts/sync-release-catalog.py --check
      - name: 버전 목록 저장
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.vitepress/theme/releases/catalog.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: 공개 버전 현황 갱신'
          git push origin "HEAD:${DEFAULT_BRANCH}"
